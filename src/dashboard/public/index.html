<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sonder Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f0f23; color: #e0e0e0; min-height: 100vh; }
    .container { max-width: 1000px; margin: 0 auto; padding: 2rem; }
    h1 { color: #6366f1; margin-bottom: 0.5rem; font-size: 2rem; }
    h2 { color: #a5b4fc; margin: 2rem 0 1rem; font-size: 1.3rem; }
    .subtitle { color: #9ca3af; margin-bottom: 2rem; }
    .card { background: #1a1a2e; border: 1px solid #2d2d44; border-radius: 12px; padding: 1.5rem; margin-bottom: 1rem; }
    .guild-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; }
    .guild-card { background: #1a1a2e; border: 1px solid #2d2d44; border-radius: 12px; padding: 1.5rem; cursor: pointer; transition: border-color 0.2s; }
    .guild-card:hover { border-color: #6366f1; }
    .guild-card h3 { color: #fff; margin-bottom: 0.5rem; }
    .btn { background: #6366f1; color: #fff; border: none; padding: 0.75rem 1.5rem; border-radius: 8px; cursor: pointer; font-size: 1rem; text-decoration: none; display: inline-block; }
    .btn:hover { background: #4f46e5; }
    .btn-outline { background: transparent; border: 1px solid #6366f1; color: #6366f1; }
    .form-group { margin-bottom: 1.25rem; }
    .form-group label { display: block; color: #9ca3af; margin-bottom: 0.4rem; font-size: 0.9rem; }
    .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 0.6rem; background: #0f0f23; border: 1px solid #2d2d44; border-radius: 6px; color: #e0e0e0; font-size: 0.95rem; }
    .form-group textarea { min-height: 80px; resize: vertical; }
    .toggle { display: flex; align-items: center; gap: 0.75rem; }
    .toggle input[type="checkbox"] { width: 40px; height: 22px; appearance: none; background: #2d2d44; border-radius: 11px; position: relative; cursor: pointer; }
    .toggle input[type="checkbox"]::after { content: ''; width: 18px; height: 18px; background: #666; border-radius: 50%; position: absolute; top: 2px; left: 2px; transition: 0.2s; }
    .toggle input[type="checkbox"]:checked { background: #6366f1; }
    .toggle input[type="checkbox"]:checked::after { left: 20px; background: #fff; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-bottom: 2rem; }
    .stat { background: #1a1a2e; border: 1px solid #2d2d44; border-radius: 8px; padding: 1rem; text-align: center; }
    .stat-value { font-size: 1.8rem; font-weight: bold; color: #6366f1; }
    .stat-label { color: #9ca3af; font-size: 0.8rem; }
    .alert { padding: 1rem; border-radius: 8px; margin-bottom: 1rem; }
    .alert-success { background: #064e3b; border: 1px solid #065f46; color: #6ee7b7; }
    .hidden { display: none; }
    .nav { display: flex; gap: 1rem; margin-bottom: 2rem; align-items: center; }
    .nav .back { color: #6366f1; cursor: pointer; text-decoration: underline; }
    @media (max-width: 600px) { .stats { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <div class="container">
    <div id="app"></div>
  </div>
  <script>
    const API = '';
    let token = localStorage.getItem('sonder_token');

    function api(path, opts = {}) {
      return fetch(API + path, { ...opts, headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json', ...opts.headers } }).then(r => r.json());
    }

    async function init() {
      if (window.location.search.includes('code=')) {
        const code = new URLSearchParams(window.location.search).get('code');
        const { access_token } = await fetch('/api/auth/callback', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code }) }).then(r => r.json());
        if (access_token) { token = access_token; localStorage.setItem('sonder_token', token); }
        history.replaceState({}, '', '/');
      }
      if (!token) return renderLogin();
      try { const user = await api('/api/user'); renderGuilds(user); } catch { renderLogin(); }
    }

    function renderLogin() {
      document.getElementById('app').innerHTML = `
        <h1>Sonder</h1>
        <p class="subtitle">AI-native Discord bot dashboard</p>
        <a class="btn" id="login-btn">Login with Discord</a>
      `;
      fetch('/api/auth/info').then(r => r.json()).then(info => {
        document.getElementById('login-btn').href = `https://discord.com/api/oauth2/authorize?client_id=${info.clientId}&redirect_uri=${encodeURIComponent(info.redirectUri)}&response_type=code&scope=identify+guilds`;
      });
    }

    async function renderGuilds(user) {
      const [guilds, stats] = await Promise.all([api('/api/guilds'), api('/api/stats')]);
      document.getElementById('app').innerHTML = `
        <h1>Sonder Dashboard</h1>
        <p class="subtitle">Welcome, ${user.username}</p>
        <div class="stats">
          <div class="stat"><div class="stat-value">${stats.guilds}</div><div class="stat-label">Servers</div></div>
          <div class="stat"><div class="stat-value">${stats.users.toLocaleString()}</div><div class="stat-label">Users</div></div>
          <div class="stat"><div class="stat-value">${stats.commands}</div><div class="stat-label">Commands</div></div>
          <div class="stat"><div class="stat-value">${Math.floor(stats.uptime / 3600)}h</div><div class="stat-label">Uptime</div></div>
        </div>
        <h2>Your Servers</h2>
        <div class="guild-list">${guilds.map(g => `<div class="guild-card" onclick="renderConfig('${g.id}')"><h3>${g.name}</h3></div>`).join('')}</div>
        <br><a class="btn btn-outline" onclick="localStorage.removeItem('sonder_token');location.reload()">Logout</a>
      `;
    }

    async function renderConfig(guildId) {
      const cfg = await api(`/api/guilds/${guildId}/config`);
      document.getElementById('app').innerHTML = `
        <div class="nav"><span class="back" onclick="init()">← Back</span><h2>${cfg.name}</h2></div>
        <div id="alert" class="alert alert-success hidden">Settings saved!</div>
        <div class="card">
          <h2>General</h2>
          <div class="form-group"><label>Prefix</label><input id="cfg-prefix" value="${cfg.prefix || ';'}"></div>
          <div class="form-group toggle"><input type="checkbox" id="cfg-leveling" ${cfg.leveling !== false ? 'checked' : ''}><label>Leveling System</label></div>
          <div class="form-group toggle"><input type="checkbox" id="cfg-antispam" ${cfg.antispam ? 'checked' : ''}><label>Anti-Spam</label></div>
          <div class="form-group toggle"><input type="checkbox" id="cfg-antilink" ${cfg.antilink ? 'checked' : ''}><label>Anti-Link</label></div>
        </div>
        <div class="card">
          <h2>Welcome</h2>
          <div class="form-group"><label>Channel ID</label><input id="cfg-welcome_channel" value="${cfg.welcome_channel || ''}"></div>
          <div class="form-group"><label>Message ({user}, {server}, {membercount})</label><textarea id="cfg-welcome_message">${cfg.welcome_message || ''}</textarea></div>
          <div class="form-group toggle"><input type="checkbox" id="cfg-welcome_card" ${cfg.welcome_card ? 'checked' : ''}><label>Image Card</label></div>
        </div>
        <div class="card">
          <h2>Goodbye</h2>
          <div class="form-group"><label>Channel ID</label><input id="cfg-goodbye_channel" value="${cfg.goodbye_channel || ''}"></div>
          <div class="form-group"><label>Message</label><textarea id="cfg-goodbye_message">${cfg.goodbye_message || ''}</textarea></div>
          <div class="form-group toggle"><input type="checkbox" id="cfg-goodbye_card" ${cfg.goodbye_card ? 'checked' : ''}><label>Image Card</label></div>
        </div>
        <div class="card">
          <h2>Logging</h2>
          <div class="form-group"><label>Modlog Channel ID</label><input id="cfg-modlog_channel" value="${cfg.modlog_channel || ''}"></div>
          <div class="form-group"><label>Audit Log Channel ID</label><input id="cfg-audit_log_channel" value="${cfg.audit_log_channel || ''}"></div>
          <div class="form-group"><label>Level-up Channel ID</label><input id="cfg-levelup_channel" value="${cfg.levelup_channel || ''}"></div>
        </div>
        <div class="card">
          <h2>Word Filter</h2>
          <div class="form-group"><label>Blocked words (comma-separated)</label><textarea id="cfg-word_filter">${(cfg.word_filter || []).join(', ')}</textarea></div>
        </div>
        <br><button class="btn" onclick="saveConfig('${guildId}')">Save Changes</button>
      `;
    }

    async function saveConfig(guildId) {
      const body = {
        prefix: document.getElementById('cfg-prefix').value || ';',
        leveling: document.getElementById('cfg-leveling').checked,
        antispam: document.getElementById('cfg-antispam').checked,
        antilink: document.getElementById('cfg-antilink').checked,
        welcome_channel: document.getElementById('cfg-welcome_channel').value || null,
        welcome_message: document.getElementById('cfg-welcome_message').value || null,
        welcome_card: document.getElementById('cfg-welcome_card').checked,
        goodbye_channel: document.getElementById('cfg-goodbye_channel').value || null,
        goodbye_message: document.getElementById('cfg-goodbye_message').value || null,
        goodbye_card: document.getElementById('cfg-goodbye_card').checked,
        modlog_channel: document.getElementById('cfg-modlog_channel').value || null,
        audit_log_channel: document.getElementById('cfg-audit_log_channel').value || null,
        levelup_channel: document.getElementById('cfg-levelup_channel').value || null,
        word_filter: document.getElementById('cfg-word_filter').value.split(',').map(w => w.trim()).filter(Boolean),
      };
      await api(`/api/guilds/${guildId}/config`, { method: 'PATCH', body: JSON.stringify(body) });
      const el = document.getElementById('alert');
      el.classList.remove('hidden');
      setTimeout(() => el.classList.add('hidden'), 3000);
    }

    init();
  </script>
</body>
</html>
